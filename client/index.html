<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beachball</title>

  <!-- the invite link is how this game travels, and a link with no preview
       looks like nothing at all when pasted into a chat. no og:image yet:
       it needs an absolute url, so a screenshot can only be added once the
       game has a real address -->
  <meta name="description" content="Two-player arcade volleyball in the browser. Send a friend the link and play.">
  <meta property="og:title" content="beachball">
  <meta property="og:description" content="Two-player arcade volleyball in the browser. Send a friend the link and play.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <!-- inline so there is no extra request, and no 404 for /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ffeb3b'/%3E%3Cpath d='M6 10q10 6 20 0M6 22q10-6 20 0M16 1v30' stroke='%23f57f17' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- the whole game is a canvas driven by a script, so with javascript off
       there is nothing on screen at all and no hint as to why -->
  <noscript>
    <p class="noscript">beachball needs javascript to run. Enable it and reload the page.</p>
  </noscript>

  <!-- shown while the world is in the lobby or on a finished match -->
  <div id="lobby" hidden>
    <h1 data-lobby-heading>ready up</h1>
    <input data-name type="text" maxlength="16" placeholder="your name" autocomplete="off" spellcheck="false">
    <button data-ready type="button">i'm ready</button>
    <p data-lobby-status></p>
    <p class="lobby__rules" data-lobby-rules></p>
  </div>

  <!-- hidden until the server names the room we ended up in -->
  <div id="room-bar" hidden>
    <span class="room-bar__label">room</span>
    <strong class="room-bar__code" data-room-code></strong>
    <button class="room-bar__button" type="button" data-copy-link>copy invite link</button>
    <span class="room-bar__ping" data-ping title="round trip to the server">—</span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
